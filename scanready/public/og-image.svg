<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: light surface -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle hairline border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#e4e4e7" stroke-width="2"/>

  <!-- Deep-blue accent bar at top -->
  <rect x="0" y="0" width="1200" height="4" fill="#1d4ed8"/>

  <!-- Wordmark: ScanReady -->
  <text
    x="80"
    y="100"
    font-family="Georgia, serif"
    font-size="28"
    font-weight="600"
    fill="#18181b"
    letter-spacing="-0.5"
  >ScanReady</text>

  <!-- DE accent -->
  <text
    x="240"
    y="100"
    font-family="Georgia, serif"
    font-size="24"
    font-weight="400"
    fill="#1d4ed8"
  >DE</text>

  <!-- Main headline -->
  <text
    x="80"
    y="290"
    font-family="Georgia, serif"
    font-size="64"
    font-weight="600"
    fill="#18181b"
    letter-spacing="-1"
  >Win the 8-second</text>
  <text
    x="80"
    y="370"
    font-family="Georgia, serif"
    font-size="64"
    font-weight="600"
    fill="#18181b"
    letter-spacing="-1"
  >German recruiter scan.</text>

  <!-- Blue hairline underline under "8-second" -->
  <rect x="310" y="298" width="278" height="3" fill="#1d4ed8"/>

  <!-- Trust line -->
  <text
    x="80"
    y="470"
    font-family="-apple-system, system-ui, sans-serif"
    font-size="24"
    font-weight="400"
    fill="#71717a"
  >Zero-retention. Grounded only in your real facts.</text>
</svg>
