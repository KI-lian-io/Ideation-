<!-- @dsCard group="Inputs" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScanReady — Inputs</title>
<style>
  :root {
    --paper:#f0eee9; --card:#fbfaf7; --ink:#1b2430; --body:#6f6960; --muted:#8a857c;
    --eyebrow:#9a8b72; --hair:rgba(27,36,48,.12); --accent:#0a7d63;
    --serif-text:"Source Serif 4","Iowan Old Style",Georgia,serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:40px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--eyebrow)}
  label{display:block;font-size:14px;font-weight:500;color:var(--ink);margin-bottom:6px}
  .input{display:block;width:100%;background:var(--card);border:1px solid var(--hair);border-radius:6px;padding:12px 16px;font-family:var(--sans);font-size:16px;color:var(--ink)}
  .input::placeholder{color:var(--muted)}
  .input-focus{border:2px solid var(--accent);padding:11px 15px}
  .doc{font-family:var(--serif-text);font-size:16px;line-height:1.65}
  .counter{text-align:right;font-size:14px;color:var(--body);margin-top:4px}
  .field{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Inputs · 6px corners · mint focus = activation signal</p>

  <div class="field">
    <label>Job posting</label>
    <input class="input" placeholder="Paste the full job posting here…" />
  </div>

  <div class="field">
    <label>Focused — 2px deep-green ring</label>
    <input class="input input-focus" value="What draws you to this role?" />
    <p class="counter">128 / 2.000</p>
  </div>

  <div class="field">
    <label>Anschreiben (document — reading serif)</label>
    <textarea class="input doc" rows="4">Sehr geehrte Damen und Herren, hiermit bewerbe ich mich…</textarea>
  </div>
</div>
</body>
</html>
