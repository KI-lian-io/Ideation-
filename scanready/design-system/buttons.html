<!-- @dsCard group="Buttons & Labels" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScanReady — Buttons & Labels</title>
<style>
  :root {
    --paper:#f0eee9; --ink:#1b2430; --body:#6f6960; --eyebrow:#9a8b72; --hair:rgba(27,36,48,.12);
    --accent:#0a7d63; --accent-deep:#0b6e58; --accent-soft:#d2e9e1;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:40px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--eyebrow)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:13px;color:var(--body);width:100%}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;border-radius:6px;padding:10px 18px;border:1px solid transparent;cursor:pointer;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-secondary{background:transparent;color:var(--ink);border-color:var(--hair)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:9999px;padding:4px 12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Buttons &amp; labels · 6px editorial corners · scale(0.97) press</p>

  <div class="row"><span class="lbl">Primary (navy) — dominant action</span>
    <button class="btn btn-primary">Convert to Lebenslauf</button>
    <button class="btn btn-primary" disabled>Disabled</button>
  </div>

  <div class="row"><span class="lbl">Accent (deep green) — single brand-emphasis CTA</span>
    <button class="btn btn-accent">Convert your CV — it's free</button>
  </div>

  <div class="row"><span class="lbl">Secondary — hairline outline</span>
    <button class="btn btn-secondary">Back to Lebenslauf</button>
    <button class="btn btn-secondary">Regenerieren</button>
  </div>

  <div class="row"><span class="lbl">Eyebrow label (mono taupe) &amp; skill chip (accent-soft tier)</span>
    <span class="eyebrow">For internationals applying in Germany</span>
    <span class="chip">React</span><span class="chip">TypeScript</span>
  </div>
</div>
</body>
</html>
