<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-soft); font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, Eyebrow, Badge, Tag } = window.ScanReadyDesignSystem_81c867;
  const ico = (n) => <img src={`../../assets/icons/${n}.svg`} width="16" height="16" alt="" />;
  function Demo() {
    return (
      <div>
        <div className="lbl">Buttons</div>
        <div className="row">
          <Button variant="primary">Convert to Lebenslauf</Button>
          <Button variant="accent">Convert your CV — it's free</Button>
          <Button variant="secondary">Back to Lebenslauf</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="primary" iconRight={ico('arrow-right')}>Continue</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
        <div className="lbl">Icon buttons</div>
        <div className="row">
          <IconButton label="Search">{ico('search')}</IconButton>
          <IconButton variant="primary" shape="circle" label="Go">{ico('arrow-right')}</IconButton>
          <IconButton variant="ghost" label="Menu">{ico('menu')}</IconButton>
        </div>
        <div className="lbl">Eyebrow &amp; badges</div>
        <div className="row">
          <Eyebrow>For internationals applying in Germany</Eyebrow>
          <Badge tone="discount">Free</Badge>
          <Badge tone="required">Required</Badge>
          <Badge tone="type">DIN 5008</Badge>
          <Badge tone="tag">Beta</Badge>
          <Badge tone="success">Normalized</Badge>
        </div>
        <div className="lbl">Skill chips &amp; tags</div>
        <div className="row">
          <Tag variant="skill">React</Tag>
          <Tag variant="skill">TypeScript</Tag>
          <Tag active>Lebenslauf</Tag>
          <Tag onRemove={() => {}}>Anschreiben</Tag>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
