<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="Base 4px, 8px primary increment" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px 24px;background:var(--canvas);font-family:var(--font-sans);}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .bar{height:16px;background:var(--accent);border-radius:2px;}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--steel);width:120px;}
</style></head>
<body>
  <div class="row"><span class="lbl">xs · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">md · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">xl · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">xxl · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">section · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="lbl">hero · 120</span><div class="bar" style="width:120px"></div></div>
</body></html>
