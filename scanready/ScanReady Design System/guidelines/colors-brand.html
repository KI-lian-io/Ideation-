<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Accent" subtitle="Navy ink, the single deep-green accent, taupe label" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans);}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{width:120px;height:64px;border-radius:var(--radius-md);border:1px solid var(--hairline-soft);}
  .name{font-size:13px;font-weight:600;color:var(--ink);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--stone);}
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--primary)"></div><div class="name">Navy ink</div><div class="hex">#1b2430</div></div>
  <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="name">Green accent</div><div class="hex">#0a7d63</div></div>
  <div class="sw"><div class="chip" style="background:var(--accent-deep)"></div><div class="name">Green deep</div><div class="hex">#0b6e58</div></div>
  <div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="name">Green soft</div><div class="hex">#d2e9e1</div></div>
  <div class="sw"><div class="chip" style="background:var(--accent-tint)"></div><div class="name">Green tint</div><div class="hex">#eef6f2</div></div>
  <div class="sw"><div class="chip" style="background:var(--eyebrow)"></div><div class="name">Taupe label</div><div class="hex">#9a8b72</div></div>
</div></body></html>
