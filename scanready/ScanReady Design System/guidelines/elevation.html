<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Flat by default; shadow only on mockup & featured tier" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:26px 24px;background:var(--surface-soft);font-family:var(--font-sans);display:flex;gap:22px;align-items:center;}
  .sw{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .box{width:150px;height:84px;background:var(--canvas);border-radius:var(--radius-lg);}
  .flat{border:1px solid var(--hairline);}
  .mockup{box-shadow:var(--shadow-mockup);}
  .glow{box-shadow:var(--shadow-brand-glow);border:2px solid var(--accent);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--steel);}
</style></head>
<body>
  <div class="sw"><div class="box flat"></div><span class="lbl">Flat · hairline</span></div>
  <div class="sw"><div class="box mockup"></div><span class="lbl">Document mockup</span></div>
  <div class="sw"><div class="box glow"></div><span class="lbl">Featured glow</span></div>
</body></html>
