<!-- @dsCard group="Spacing" viewport="700x170" name="Radius scale" subtitle="Editorial discipline: 6px buttons, 12px cards, pills for chips only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px 24px;background:var(--canvas);font-family:var(--font-sans);display:flex;gap:18px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .box{width:84px;height:60px;background:var(--surface);border:1px solid var(--hairline);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--steel);}
</style></head>
<body>
  <div class="sw"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs · 4</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm/button · 6</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 8</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 12</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl · 16</span></div>
  <div class="sw"><div class="box" style="border-radius:var(--radius-full)"></div><span class="lbl">full · chips</span></div>
</body></html>
