<!-- @dsCard group="Type" viewport="700x180" name="Mono & eyebrow" subtitle="Geist Mono for code; taupe uppercase eyebrow label" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px 24px;background:var(--canvas);}
  .eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--eyebrow);}
  .code{font-family:var(--font-mono);font-size:14px;color:var(--on-dark);background:var(--surface-code);border-radius:var(--radius-md);padding:14px 16px;margin-top:14px;}
  .inline{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--charcoal);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-xs);padding:2px 6px;}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--stone);margin-top:14px;}
</style></head>
<body>
  <div class="eyebrow">What's new · Platform · Required</div>
  <div class="code">scanready deploy --prod</div>
  <div class="meta">Inline reference like <span class="inline">scanready.config.js</span> sits in mono on paper.</div>
</body></html>
