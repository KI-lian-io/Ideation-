<!-- @dsCard group="Colors" viewport="700x150" name="Functional" subtitle="Tag blue, warn, error — secondary signals only, used sparingly" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans);}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{width:120px;height:64px;border-radius:var(--radius-md);}
  .name{font-size:13px;font-weight:600;color:var(--ink);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--stone);}
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--brand-tag)"></div><div class="name">Tag blue</div><div class="hex">#3772cf</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-warn)"></div><div class="name">Warn</div><div class="hex">#b9791a</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-error)"></div><div class="name">Error</div><div class="hex">#c0503c</div></div>
</div></body></html>
