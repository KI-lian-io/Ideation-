<!-- @dsCard group="Colors" viewport="700x170" name="Signature band" subtitle="The navy color-block — the one dark surface, with the accent lock dot" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans);}
  .band{background:linear-gradient(135deg,var(--band-from) 0%,var(--band-to) 100%);border-radius:var(--radius-lg);padding:32px;display:flex;align-items:center;gap:18px;}
  .lock{width:40px;height:40px;border-radius:var(--radius-full);background:var(--accent);flex-shrink:0;}
  .ttl{font-family:var(--font-serif);font-size:28px;font-weight:600;color:var(--on-dark);}
  .sub{font-size:14px;color:var(--on-dark-soft);margin-top:4px;}
</style></head>
<body>
  <div class="band">
    <div class="lock"></div>
    <div><div class="ttl">Zero-retention, by design.</div><div class="sub">band-from #1b2430 → band-to #234038 · accent lock dot · on-dark / on-dark-soft text</div></div>
  </div>
</body></html>
