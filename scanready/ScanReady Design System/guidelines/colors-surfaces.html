<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--surface-soft);font-family:var(--font-sans);}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:8px;}
  .chip{width:120px;height:64px;border-radius:var(--radius-md);border:1px solid var(--hairline);}
  .name{font-size:13px;font-weight:600;color:var(--ink);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--stone);}
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--canvas)"></div><div class="name">Canvas</div><div class="hex">#fbfaf7</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="name">Surface</div><div class="hex">#f0eee9</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-soft)"></div><div class="name">Surface soft</div><div class="hex">#f7f6f2</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-code)"></div><div class="name">Code</div><div class="hex">#161b22</div></div>
  <div class="sw"><div class="chip" style="background:var(--canvas-dark)"></div><div class="name">Dark</div><div class="hex">#1b2430</div></div>
</div></body></html>
