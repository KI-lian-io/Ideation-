<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:24px;background:var(--canvas);font-family:var(--font-sans);}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center;}
  .ic{width:24px;height:24px;color:var(--steel);}
  .ic.active{color:var(--ink);}
  .ic.mint{color:var(--accent);}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--stone);margin-top:16px;}
  img{display:block;width:100%;height:100%;}
</style></head>
<body>
  <div class="row">
    <span class="ic"><img src="../assets/icons/search.svg" /></span>
    <span class="ic"><img src="../assets/icons/book-open.svg" /></span>
    <span class="ic active"><img src="../assets/icons/terminal.svg" /></span>
    <span class="ic"><img src="../assets/icons/layers.svg" /></span>
    <span class="ic"><img src="../assets/icons/shield.svg" /></span>
    <span class="ic"><img src="../assets/icons/globe.svg" /></span>
    <span class="ic"><img src="../assets/icons/rocket.svg" /></span>
    <span class="ic mint"><img src="../assets/icons/check.svg" /></span>
    <span class="ic"><img src="../assets/icons/arrow-right.svg" /></span>
  </div>
  <div class="meta">Lucide · 1.75 stroke · steel at rest · ink active · green reserved for the success/check role</div>
</body></html>
