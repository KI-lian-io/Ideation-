<!-- @dsCard group="Colors" viewport="700x150" name="Text ramp" subtitle="Warm navy-to-stone text hierarchy" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--canvas);font-family:var(--font-sans);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{width:96px;height:56px;border-radius:var(--radius-md);}
  .name{font-size:12px;font-weight:600;color:var(--ink);}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--stone);}
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="name">Ink</div><div class="hex">#1b2430</div></div>
  <div class="sw"><div class="chip" style="background:var(--charcoal)"></div><div class="name">Charcoal</div><div class="hex">#2a3340</div></div>
  <div class="sw"><div class="chip" style="background:var(--slate)"></div><div class="name">Slate</div><div class="hex">#4a5160</div></div>
  <div class="sw"><div class="chip" style="background:var(--steel)"></div><div class="name">Steel</div><div class="hex">#6f6960</div></div>
  <div class="sw"><div class="chip" style="background:var(--stone)"></div><div class="name">Stone</div><div class="hex">#8a857c</div></div>
  <div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="name">Muted</div><div class="hex">#a8a39a</div></div>
</div></body></html>
